<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Ancient proteins help identify Denisovan fossils</title><desc id="d">Researchers compared proteins extracted from two Xujiayao fossils with a Denisovan-specific collagen variant, then compared anatomical traits across East Asian Middle Pleistocene fossils.</desc><rect width="1200" height="700" fill="#eee9e2"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#756b61" letter-spacing="3">ANCIENT PROTEINS, EVOLUTIONARY RELATIONSHIPS</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#23241f">A molecular clue, then a fossil map</text><g transform="translate(95 220)"><path d="M92 20c-38 0-68 34-68 80v68c0 22-18 38-18 70 0 35 29 64 66 64h120c40 0 68-30 68-67 0-28-18-44-19-69l-4-68c-2-44-33-78-73-78z" fill="#c3a87b" stroke="#8b7555" stroke-width="6"/><path d="M64 123q48 36 101 0m-82 77q29 18 60 0" fill="none" stroke="#8b7555" stroke-width="9" stroke-linecap="round"/><text x="36" y="350" font-family="Arial,sans-serif" font-size="20" fill="#514b43">Xujiayao fossil</text></g><path d="M403 375h90" stroke="#315bdb" stroke-width="7"/><path d="m478 359 24 16-24 16" fill="#315bdb"/><rect x="516" y="248" width="265" height="254" rx="12" fill="#fff"/><text x="550" y="297" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#23241f">COL1A2</text><path d="M550 336h190" stroke="#b1bbb1" stroke-width="10"/><path d="M550 336h119" stroke="#315bdb" stroke-width="10"/><circle cx="669" cy="336" r="17" fill="#e1805e"/><text x="550" y="385" font-family="Arial,sans-serif" font-size="19" fill="#23241f">variant supports</text><text x="550" y="414" font-family="Arial,sans-serif" font-size="19" fill="#23241f">Denisovan lineage</text><text x="550" y="465" font-family="Arial,sans-serif" font-size="16" fill="#6a6b65">18 endogenous proteins</text><path d="M795 375h78" stroke="#315bdb" stroke-width="7"/><path d="m858 359 24 16-24 16" fill="#315bdb"/><g transform="translate(925 253)" fill="none" stroke="#58554f" stroke-width="11"><path d="M0 70q98-78 206 0v122q-100 72-206 0z"/><path d="M16 104q82 43 174 0M28 154q75-33 149 0" stroke="#c3a87b" stroke-width="8"/></g><text x="910" y="505" font-family="Arial,sans-serif" font-size="18" fill="#514b43">shared morphology</text><text x="64" y="588" font-family="Arial,sans-serif" font-size="19" fill="#514b43">Two fossil specimens → one protein variant → comparison across East Asian fossils</text><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#756b61">Explanatory illustration; the simplified skull is not a reconstruction or specimen image.</text></svg>
