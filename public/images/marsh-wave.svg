<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">A large wave flume tested salt marsh protection</title><desc id="d">A cross-section shows waves moving through marsh vegetation toward a dike. Vegetation attenuated waves strongly on lower-energy coasts, less during larger waves, while the marsh bed mostly persisted.</desc><rect width="1200" height="700" fill="#e6eef0"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#51656a" letter-spacing="3">NATURE-BASED FLOOD DEFENCE, TESTED</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#23241f">The marsh held; its plants bent</text><path d="M0 366q90-75 180 0t180 0t180 0t180 0" fill="none" stroke="#398bb0" stroke-width="19"/><path d="M526 364q76-36 142 0" fill="none" stroke="#398bb0" stroke-width="11"/><rect x="0" y="438" width="1200" height="262" fill="#c3a77d"/><path d="M0 429h827l114-95 259-1v267H0z" fill="#9cbd93"/><g stroke="#486e48" stroke-width="8" stroke-linecap="round"><path d="M92 430 82 320m20 110 35-131m35 131 3-122m58 122-17-131m61 131 21-123m44 123 4-117m49 117-13-132m55 132 24-123m44 123 1-132m53 132-14-123m48 123 18-118m49 118-5-132m53 132 22-116m51 116 3-133m50 133 18-117m43 117-6-131"/></g><path d="M860 430 971 334h229v268H860z" fill="#6f797c"/><path d="M903 392h248" stroke="#d8dddc" stroke-width="9"/><text x="1004" y="510" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">DIKE</text><g font-family="Arial,sans-serif"><rect x="73" y="197" width="302" height="71" rx="35" fill="#fff"/><text x="108" y="243" font-size="21" fill="#23241f">Flume: waves up to 2 m</text><rect x="413" y="197" width="340" height="71" rx="35" fill="#315bdb"/><text x="452" y="243" font-size="21" fill="#fff">&gt;1 m: plant effect ≤10%</text><rect x="792" y="197" width="331" height="71" rx="35" fill="#315bdb"/><text x="828" y="243" font-size="21" fill="#fff">≤1 m: attenuation &gt;10%</text></g><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#51656a">Schematic. Flume results and global estimates are not identical to a local flood-risk guarantee.</text></svg>
