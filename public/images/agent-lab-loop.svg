<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">A research agent works inside an experimental loop</title><desc id="d">A human frames a question. An AI agent consults literature and simulations, proposes an experiment, and a laboratory returns measured results for review.</desc><rect width="1200" height="700" fill="#e9e9e3"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#55574e" letter-spacing="3">FROM QUESTION TO MEASUREMENT</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#23241f">The scientist stays in the loop</text><g font-family="Arial,sans-serif"><rect x="64" y="214" width="230" height="230" rx="8" fill="#24251f"/><circle cx="179" cy="289" r="35" fill="#315bdb"/><path d="M124 390c8-47 33-70 55-70s47 23 55 70" fill="#f3f2ed"/><text x="104" y="422" font-size="18" fill="#fff">Question & judgement</text><rect x="355" y="214" width="230" height="230" rx="8" fill="#315bdb"/><circle cx="470" cy="294" r="38" fill="none" stroke="#fff" stroke-width="4"/><path d="M447 295h46M470 272v46M437 270l-15-17m81 17 15-17m-81 85-15 17m81-17 15 17" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="404" y="392" font-size="18" fill="#fff">Search · model · plan</text><text x="392" y="420" font-size="15" fill="#dbe4ff">traceable tools, bounded tasks</text><rect x="646" y="214" width="230" height="230" rx="8" fill="#fff"/><path d="M704 330h114M714 305h94M724 280h74" stroke="#8c9c8f" stroke-width="12" stroke-linecap="round"/><path d="M700 365h122" stroke="#315bdb" stroke-width="5"/><text x="710" y="414" font-size="18" fill="#23241f">Proposed experiment</text><rect x="937" y="214" width="199" height="230" rx="8" fill="#d6ddd2"/><path d="M987 340v-56h100v56M997 283v-23h80v23" fill="none" stroke="#455449" stroke-width="7"/><circle cx="1037" cy="316" r="15" fill="#315bdb"/><text x="968" y="395" font-size="18" fill="#23241f">Instrument returns data</text><g stroke="#315bdb" stroke-width="6" fill="none"><path d="M301 329h42"/><path d="M592 329h42"/><path d="M883 329h42"/><path d="M1036 458v72H179v-72"/></g><g fill="#315bdb"><path d="m337 318 15 11-15 11z"/><path d="m628 318 15 11-15 11z"/><path d="m919 318 15 11-15 11z"/><path d="m168 475 11-15 11 15z"/></g><text x="448" y="574" font-family="Arial,sans-serif" font-size="19" fill="#55574e">Review results · update the question · repeat</text><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#73766c">Conceptual workflow, not a claim that current agents autonomously complete reliable science.</text></svg>
