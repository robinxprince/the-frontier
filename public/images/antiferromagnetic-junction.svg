<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">An all-antiferromagnetic tunnel junction</title><desc id="desc">Two layers of non-collinear antiferromagnet PtMn3 are separated by a magnesium oxide barrier. Current drives a switching torque; the relative layer states change electrical resistance.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="64" y="88" fill="#25241f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Antiferromagnets can read and write a memory state</text><text x="64" y="145" fill="#68665f" font-family="Arial,sans-serif" font-size="19">DEVICE MECHANISM · ORIGINAL EXPLANATORY DIAGRAM</text><rect x="220" y="205" width="760" height="160" fill="#d9e1dd"/><rect x="220" y="365" width="760" height="60" fill="#2856d9"/><rect x="220" y="425" width="760" height="160" fill="#d9e1dd"/><text x="250" y="242" fill="#25241f" font-family="Arial,sans-serif" font-size="21" font-weight="600">PtMn₃ antiferromagnet · reference layer</text><text x="250" y="402" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="600">MgO tunnel barrier</text><text x="250" y="462" fill="#25241f" font-family="Arial,sans-serif" font-size="21" font-weight="600">PtMn₃ antiferromagnet · switchable layer</text><g stroke="#24231f" stroke-width="5"><path d="M350 280l35 35m0-35l-35 35M470 280l35 35m0-35l-35 35M590 280l35 35m0-35l-35 35M710 280l35 35m0-35l-35 35M830 280l35 35m0-35l-35 35"/><path d="M350 500l35 35m0-35l-35 35M470 500l35 35m0-35l-35 35M590 500l35 35m0-35l-35 35M710 500l35 35m0-35l-35 35M830 500l35 35m0-35l-35 35"/></g><path d="M600 160v30M600 610v-30" stroke="#c25038" stroke-width="6"/><path d="M590 180l10 12 10-12M590 590l10-12 10 12" fill="none" stroke="#c25038" stroke-width="6"/><text x="640" y="190" fill="#c25038" font-family="Arial,sans-serif" font-size="20">current drives switching</text><text x="64" y="640" fill="#68665f" font-family="Arial,sans-serif" font-size="17">Conceptual, not to scale. Opposing local moments can cancel net magnetization while a higher-order order parameter remains.</text></svg>