<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Different labels can describe overlapping policy preferences</title><desc id="desc">A conceptual diagram of overlapping support for mixed economic policies despite ideological labels. Based on a five-study paper; the graphic itself is not data.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24231f">ONE POLICY MIX, DIFFERENT LABELS</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#65645e">An illustration of the paper’s question, not a numerical result</text><g font-family="Arial,sans-serif"><rect x="95" y="205" width="385" height="290" rx="16" fill="#dfe8f5"/><rect x="720" y="205" width="385" height="290" rx="16" fill="#f2e4d2"/><text x="140" y="255" font-size="22" font-weight="700" fill="#315bdb">LABEL: “CAPITALIST”</text><text x="765" y="255" font-size="22" font-weight="700" fill="#9e5d31">LABEL: “SOCIALIST”</text><circle cx="450" cy="350" r="125" fill="#e7e5df" stroke="#9ca9bd" stroke-width="4"/><circle cx="750" cy="350" r="125" fill="#e7e5df" stroke="#c8a987" stroke-width="4"/><path d="M450 350H750" stroke="#315bdb" stroke-width="5" stroke-dasharray="10 8"/><rect x="395" y="315" width="410" height="75" rx="20" fill="#24231f"/><text x="425" y="345" font-size="17" font-weight="700" fill="#fff">SHARED POLICY ELEMENTS</text><text x="425" y="370" font-size="14" fill="#d6d4ce">markets + public protections + services</text><text x="182" y="435" font-size="16" fill="#4d4c47">person’s preferred mix</text><text x="815" y="435" font-size="16" fill="#4d4c47">person’s preferred mix</text><rect x="230" y="545" width="740" height="65" rx="12" fill="#fff"/><text x="290" y="585" font-size="18" font-weight="700" fill="#24231f">Five studies · 1,753 participants · United States + Brazil</text></g></svg>
