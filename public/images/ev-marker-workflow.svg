<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Searching blood for neuron-derived extracellular vesicles</title><desc id="desc">A conceptual research workflow from blood sample purification to vesicle protein markers and candidate neuron markers, not research data.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24231f">THE ORGAN-OF-ORIGIN PROBLEM</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#65645e">How to find brain-derived vesicles among particles from the whole body · conceptual, not data</text><g font-family="Arial,sans-serif"><rect x="75" y="210" width="220" height="180" rx="12" fill="#fff"/><text x="103" y="250" font-size="20" font-weight="700" fill="#24231f">BLOOD SAMPLE</text><circle cx="130" cy="310" r="18" fill="#c75a54"/><circle cx="185" cy="325" r="11" fill="#91b8d2"/><circle cx="235" cy="300" r="15" fill="#88bca8"/><text x="105" y="365" font-size="15" fill="#65645e">many cell types contribute</text><path d="M310 300h70m-15-15 15 15-15 15" stroke="#315bdb" stroke-width="5" fill="none"/><rect x="400" y="210" width="220" height="180" rx="12" fill="#24231f"/><text x="428" y="250" font-size="20" font-weight="700" fill="#fff">PURIFY VESICLES</text><circle cx="510" cy="315" r="43" fill="#d5e7df" stroke="#78a999" stroke-width="8"/><circle cx="510" cy="315" r="16" fill="#b75b7d"/><circle cx="543" cy="283" r="8" fill="#315bdb"/><text x="427" y="365" font-size="15" fill="#d6d4ce">reduce free-protein noise</text><path d="M635 300h70m-15-15 15 15-15 15" stroke="#315bdb" stroke-width="5" fill="none"/><rect x="725" y="210" width="210" height="180" rx="12" fill="#fff"/><text x="750" y="250" font-size="20" font-weight="700" fill="#24231f">MATCH MARKERS</text><path d="M765 300h120M765 325h82M765 350h105" stroke="#8b9691" stroke-width="8" stroke-linecap="round"/><circle cx="885" cy="300" r="10" fill="#315bdb"/><circle cx="847" cy="325" r="10" fill="#315bdb"/><text x="750" y="375" font-size="14" fill="#65645e">gene specificity + EV proteomics</text><path d="M950 300h65m-15-15 15 15-15 15" stroke="#315bdb" stroke-width="5" fill="none"/><rect x="1030" y="210" width="120" height="180" rx="12" fill="#d5e7df"/><text x="1051" y="255" font-size="18" font-weight="700" fill="#24231f">CANDIDATE</text><text x="1051" y="300" font-size="34" font-weight="700" fill="#315bdb">28</text><text x="1051" y="329" font-size="15" fill="#4d4c47">markers</text><text x="1051" y="360" font-size="13" fill="#65645e">not yet a test</text></g></svg>
