<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">From words to a working protein</title><desc id="desc">A conceptual diagram showing a function prompt passing through a model to a proposed protein sequence, then experimental testing. This is an explanatory illustration, not research data.</desc>
<rect width="1200" height="700" fill="#eeede9"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24231f">FROM WORDS TO A WORKING PROTEIN</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#65645e">A conceptual map of the design-and-test loop · not research data</text>
<g font-family="Arial,sans-serif"><rect x="72" y="210" width="225" height="180" rx="10" fill="#fff"/><text x="95" y="254" font-size="18" font-weight="700" fill="#24231f">FUNCTION PROMPT</text><text x="95" y="300" font-size="17" fill="#4d4c47">“Break down PET”</text><text x="95" y="334" font-size="15" fill="#74736d">desired job, in words</text>
<path d="M310 300h65" stroke="#315bdb" stroke-width="5"/><path d="m362 286 18 14-18 14" fill="none" stroke="#315bdb" stroke-width="5"/>
<rect x="390" y="210" width="220" height="180" rx="10" fill="#24231f"/><text x="416" y="254" font-size="18" font-weight="700" fill="#fff">GENERATIVE MODEL</text><circle cx="448" cy="310" r="12" fill="#8cc5b4"/><circle cx="497" cy="310" r="12" fill="#f1b55f"/><circle cx="546" cy="310" r="12" fill="#8cc5b4"/><path d="M460 310h25m24 0h25" stroke="#fff" stroke-width="3"/><text x="416" y="356" font-size="15" fill="#d6d4ce">intent → candidate designs</text>
<path d="M624 300h65" stroke="#315bdb" stroke-width="5"/><path d="m676 286 18 14-18 14" fill="none" stroke="#315bdb" stroke-width="5"/>
<rect x="704" y="210" width="215" height="180" rx="10" fill="#fff"/><text x="728" y="254" font-size="18" font-weight="700" fill="#24231f">PROTEIN CANDIDATE</text><path d="M738 313c28-55 55 55 83 0s54 52 75-3" fill="none" stroke="#b75b7d" stroke-width="8" stroke-linecap="round"/><text x="728" y="356" font-size="15" fill="#74736d">sequence folds into a shape</text>
<path d="M932 300h65" stroke="#315bdb" stroke-width="5"/><path d="m984 286 18 14-18 14" fill="none" stroke="#315bdb" stroke-width="5"/>
<rect x="1010" y="210" width="150" height="180" rx="10" fill="#d5e7df"/><text x="1030" y="254" font-size="17" font-weight="700" fill="#24231f">LAB TEST</text><path d="M1062 282v52m-25-26h50" stroke="#315bdb" stroke-width="5"/><text x="1030" y="356" font-size="15" fill="#4d4c47">does it work?</text>
<path d="M1082 412v65H170v-65" fill="none" stroke="#929f99" stroke-width="3" stroke-dasharray="8 8"/><path d="m157 429 13-18 13 18" fill="none" stroke="#929f99" stroke-width="3"/><text x="445" y="515" font-size="18" font-weight="700" fill="#4d4c47">MEASURE → REFINE THE NEXT DESIGN</text></g></svg>
