<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A mesh shields a bacterial community</title><desc id="desc">A fibrin-like net surrounds clustered bacteria while a shaped enzyme approaches and opens a gap in the protective mesh.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e2dc"/><stop offset="1" stop-color="#f0e9db"/></linearGradient><pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7b8676" opacity=".18"/></pattern></defs><rect width="1200" height="700" fill="url(#bg)"/><rect width="1200" height="700" fill="url(#grain)"/><circle cx="875" cy="270" r="260" fill="#e1b766" opacity=".07"/><g stroke="#79b9ab" stroke-width="7" opacity=".65"><path d="M180 140l260 390M300 110l290 430M430 110l290 440M560 120l300 420M700 110l300 420M100 250l840 0M130 355l820 0M200 460l770 0M260 150l600 360M850 160L220 510"/></g><g fill="#e37a67" stroke="#ffd0b7" stroke-width="5"><ellipse cx="390" cy="305" rx="44" ry="23" transform="rotate(30 390 305)"/><ellipse cx="535" cy="350" rx="45" ry="22" transform="rotate(-20 535 350)"/><ellipse cx="650" cy="285" rx="43" ry="21" transform="rotate(40 650 285)"/><ellipse cx="470" cy="455" rx="42" ry="22" transform="rotate(-15 470 455)"/><ellipse cx="680" cy="445" rx="42" ry="21" transform="rotate(25 680 445)"/></g><g fill="#f3c66b"><circle cx="385" cy="305" r="6"/><circle cx="535" cy="350" r="6"/><circle cx="650" cy="285" r="6"/><circle cx="470" cy="455" r="6"/><circle cx="680" cy="445" r="6"/></g><path d="M880 245l150 0-38 56h-42l-20 50-28-50h-40Z" fill="#4b79d8" stroke="#b7caff" stroke-width="5"/><path d="M940 350l-90 92" stroke="#f4d26f" stroke-width="7" stroke-dasharray="10 13"/><path d="M790 470l100-100" stroke="#f4d26f" stroke-width="4"/><circle cx="826" cy="436" r="25" fill="none" stroke="#f4d26f" stroke-width="4"/><path d="M55 630H1145" stroke="#6c817b