<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A two-part enzyme attacks a bacterial shield</title><desc id="desc">A conceptual diagram showing staphylokinase activating fibrin breakdown and an endolysin attacking bacterial cell walls, not a microscopy image or measured data.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24231f">REMOVE THE SHIELD. REACH THE BACTERIA.</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#65645e">FibriLysin’s proposed two-step mechanism · explanatory illustration, not microscopy</text><g font-family="Arial,sans-serif"><circle cx="380" cy="365" r="180" fill="#d8c3a2" stroke="#b68750" stroke-width="12" stroke-dasharray="20 12"/><text x="262" y="170" font-size="18" font-weight="700" fill="#7f5d34">FIBRIN SHIELD</text><g fill="#b94e50"><ellipse cx="330" cy="300" rx="37" ry="19"/><ellipse cx="440" cy="342" rx="37" ry="19"/><ellipse cx="310" cy="410" rx="37" ry="19"/><ellipse cx="420" cy="445" rx="37" ry="19"/></g><g stroke="#742e38" stroke-width="4"><path d="M305 300h50M415 342h50M285 410h50M395 445h50"/></g><rect x="700" y="215" width="400" height="120" rx="16" fill="#fff"/><circle cx="760" cy="275" r="25" fill="#315bdb"/><text x="810" y="266" font-size="20" font-weight="700" fill="#24231f">1 · STAPHYLOKINASE</text><text x="810" y="300" font-size="16" fill="#65645e">activates local fibrin breakdown</text><rect x="700" y="365" width="400" height="120" rx="16" fill="#24231f"/><circle cx="760" cy="425" r="25" fill="#f1b55f"/><text x="810" y="416" font-size="20" font-weight="700" fill="#fff">2 · ENDOLYSIN</text><text x="810" y="450" font-size="16" fill="#d6d4ce">cuts bacterial cell-wall peptidoglycan</text><path d="M600 330h65m-15-15 15 15-15 15M600 405h65m-15-15 15 15-15 15" fill="none" stroke="#315bdb" stroke-width="5"/><text x="720" y="555" font-size="16" fill="#4d4c47">Promising in models; clinical benefit is untested.</text></g></svg>
