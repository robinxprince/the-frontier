<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Drought and prey decline alter predator interactions</title><desc id="desc">A causal diagram linking disease-related rabbit decline and drought to increased lynx predation on kite nests, with potential downstream ecosystem effects.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="64" y="88" fill="#25241f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Drought and prey decline alter predator interactions</text><text x="64" y="145" fill="#68665f" font-family="Arial,sans-serif" font-size="19">MECHANISM MAP · ORIGINAL EXPLANATORY DIAGRAM</text><g><rect x="130" y="250" width="220" height="150" rx="2" fill="#2856d9"/><text x="240" y="310" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="240" dy="0">Disease</tspan></text></g><path d="M 358 325 H 482" stroke="#2856d9" stroke-width="5"/><path d="M 472 315 L 482 325 L 472 335" fill="none" stroke="#2856d9" stroke-width="5"/><g><rect x="500" y="250" width="220" height="150" rx="2" fill="#dde3db"/><text x="610" y="310" text-anchor="middle" fill="#24231f" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="610" dy="0">fewer rabbits; drought</tspan></text></g><path d="M 728 325 H 852" stroke="#2856d9" stroke-width="5"/><path d="M 842 315 L 852 325 L 842 335" fill="none" stroke="#2856d9" stroke-width="5"/><g><rect x="870" y="250" width="220" height="150" rx="2" fill="#bdd0c2"/><text x="980" y="310" text-anchor="middle" fill="#24231f" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="980" dy="0">fewer alternatives</tspan></text></g><text x="64" y="520" fill="#25241f" font-family="Arial,sans-serif" font-size="21">The study is observational across decades; causal links vary in strength.</text><text x="64" y="650" fill="#68665f" font-family="Arial,sans-serif" font-size="17">THE FRONTIER  /  Conceptual illustration; not research data</text></svg>