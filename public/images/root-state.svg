<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A shared stress-responsive state across root cell lineages</title><desc id="desc">A conceptual branching root-cell lineage map overlaid with a common water-stress-responsive cell state regulated in part by abscisic acid.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="64" y="88" fill="#25241f" font-family="Arial,sans-serif" font-size="34" font-weight="700">A shared stress-responsive state across root cell lineages</text><text x="64" y="145" fill="#68665f" font-family="Arial,sans-serif" font-size="19">MECHANISM MAP · ORIGINAL EXPLANATORY DIAGRAM</text><g><rect x="130" y="250" width="220" height="150" rx="2" fill="#2856d9"/><text x="240" y="310" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="240" dy="0">Cell lineage +</tspan><tspan x="240" dy="34">ABA-linked state</tspan></text></g><path d="M 358 325 H 482" stroke="#2856d9" stroke-width="5"/><path d="M 472 315 L 482 325 L 472 335" fill="none" stroke="#2856d9" stroke-width="5"/><g><rect x="500" y="250" width="220" height="150" rx="2" fill="#dde3db"/><text x="610" y="310" text-anchor="middle" fill="#24231f" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="610" dy="0">context-sensitive root</tspan></text></g><text x="64" y="520" fill="#25241f" font-family="Arial,sans-serif" font-size="21">The diagram is conceptual, not a single-cell atlas.</text><text x="64" y="650" fill="#68665f" font-family="Arial,sans-serif" font-size="17">THE FRONTIER  /  Conceptual illustration; not research data</text></svg>