<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">A digital fibre combines display and touch sensing</title><desc id="d">A magnified fibre cross-section contains addressable LED pixels and a coaxial sensing layer. Fibres form a sleeve display connected to inputs and wireless communication.</desc><rect width="1200" height="700" fill="#e9e9e3"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#55574e" letter-spacing="3">TEXTILE AS A COMPUTER SURFACE</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#23241f">A screen woven from fibres</text><g transform="translate(310 358)"><circle r="142" fill="#d5ddd2" stroke="#41574d" stroke-width="9"/><circle r="102" fill="#f6f5ef" stroke="#315bdb" stroke-width="11"/><circle r="56" fill="#20231f"/><circle cx="-26" cy="-21" r="13" fill="#315bdb"/><circle cx="20" cy="-22" r="13" fill="#ee8c61"/><circle cx="-26" cy="23" r="13" fill="#e3bf57"/><circle cx="20" cy="23" r="13" fill="#315bdb"/><text x="-72" y="198" font-family="Arial,sans-serif" font-size="18" fill="#55574e">fibre cross-section</text></g><g stroke="#315bdb" stroke-width="6" fill="none"><path d="M476 300c130-115 201-123 300-67"/><path d="M476 359h305"/><path d="M476 416c130 115 201 123 300 67"/></g><g fill="#315bdb"><circle cx="546" cy="245" r="10"/><circle cx="646" cy="226" r="10"/><circle cx="544" cy="359" r="10"/><circle cx="655" cy="359" r="10"/><circle cx="546" cy="473" r="10"/><circle cx="646" cy="492" r="10"/></g><text x="503" y="191" font-family="Arial,sans-serif" font-size="18" fill="#55574e">addressable pixels + touch location</text><path d="M826 260h215v192H826z" fill="#24251f"/><path d="M853 292h161v126H853z" fill="#315bdb"/><g fill="#f2f0e9"><rect x="872" y="311" width="37" height="37"/><rect x="925" y="311" width="37" height="37"/><rect x="978" y="311" width="18" height="37"/><rect x="872" y="363" width="37" height="37"/><rect x="925" y="363" width="71" height="37"/></g><text x="875" y="488" font-family="Arial,sans-serif" font-size="18" fill="#23241f">woven sleeve GUI</text><text x="64" y="593" font-family="Arial,sans-serif" font-size="19" fill="#55574e">Reported prototype: 96 × 54 pixels · 30 frames/s · 8-bit colour</text><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#73766c">Conceptual cutaway; not a microscope image or photograph of the study device.</text></svg>
