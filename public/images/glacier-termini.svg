<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Glaciers behave differently at different endpoints</title><desc id="desc">A conceptual comparison of land, lake, and ocean glacier termini with observed differences in speed and mass loss, based on a 2026 global study.</desc><rect width="1200" height="700" fill="#e8edf0"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24231f">WHERE THE ICE ENDS CHANGES ITS DYNAMICS</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#65645e">Illustrative cross-sections; values summarize a global statistical study</text><g font-family="Arial,sans-serif"><path d="M110 420 210 250 390 420" fill="#c7d6df" stroke="#718b99" stroke-width="4"/><path d="M210 250 390 420h-90l-90-100z" fill="#fff"/><text x="190" y="465" font-size="18" font-weight="700" fill="#24231f">LAND</text><path d="M465 420 545 255 685 390" fill="#c7d6df" stroke="#718b99" stroke-width="4"/><path d="M600 330h150v90H600z" fill="#75aeca"/><path d="M545 255 610 325v95h-48z" fill="#fff"/><text x="560" y="465" font-size="18" font-weight="700" fill="#24231f">LAKE</text><path d="M810 420 885 240 1015 350" fill="#c7d6df" stroke="#718b99" stroke-width="4"/><path d="M960 337h190v83H960z" fill="#438aad"/><path d="M885 240 982 330v90h-44z" fill="#fff"/><text x="930" y="465" font-size="18" font-weight="700" fill="#24231f">OCEAN</text><rect x="110" y="525" width="980" height="92" rx="12" fill="#fff"/><text x="145" y="565" font-size="18" font-weight="700" fill="#24231f">LAKE-TERMINATING GLACIERS</text><text x="145" y="595" font-size="17" fill="#4d4c47">57% greater median specific mass loss than land-terminating glaciers (2000–2019)</text><text x="840" y="566" font-size="15" fill="#65645e">not a forecast</text></g></svg>
