<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">A Stanford analysis finds an employment gap among young workers in AI-exposed jobs</title><desc id="d">A diverging line depicts relative employment for workers aged 22 to 25 in AI-exposed occupations versus a comparison trend, with a 19 percent gap in the revised 2026 working paper. It is descriptive, not a causal estimate.</desc><rect width="1200" height="700" fill="#f0eee8"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#666359" letter-spacing="3">AN EARLY LABOUR-MARKET SIGNAL</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#23241f">A gap in entry-level hiring</text><path d="M147 492H1048M147 226V492" stroke="#8c8c82" stroke-width="3"/><path d="M164 448 363 420 560 386 758 336 953 282" fill="none" stroke="#315bdb" stroke-width="8"/><path d="M164 448 363 448 560 448 758 448 953 448" fill="none" stroke="#848a80" stroke-width="5" stroke-dasharray="12 10"/><circle cx="953" cy="282" r="13" fill="#315bdb"/><path d="M1004 282h76" stroke="#e2845c" stroke-width="5"/><text x="1002" y="254" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#b95e40">−19%</text><text x="145" y="530" font-family="Arial,sans-serif" font-size="18" fill="#666359">Earlier comparison</text><text x="852" y="530" font-family="Arial,sans-serif" font-size="18" fill="#666359">Latest data, June 2026</text><g font-family="Arial,sans-serif" font-size="18" fill="#55574e"><path d="M157 586h56" stroke="#315bdb" stroke-width="6"/><text x="225" y="593">AI-exposed roles, ages 22–25 (relative trend)</text><path d="M650 586h56" stroke="#848a80" stroke-width="5" stroke-dasharray="10 8"/><text x="718" y="593">Comparison trajectory</text></g><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#73766c">Illustrative redraw of a relative gap, not the study’s underlying time series; working paper, descriptive association.</text></svg>
