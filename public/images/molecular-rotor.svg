<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Electric current turns a helicene molecule</title><desc id="d">A helical molecule held between two gold electrodes rotates under electrical bias. Its orientation changes the available conductance.</desc><rect width="1200" height="700" fill="#171b22"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9ca9b9" letter-spacing="3">A MACHINE BUILT FROM ONE MOLECULE</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#f2f0e9">Current supplies the torque</text><g fill="#b9a16e"><rect x="110" y="286" width="215" height="130" rx="10"/><rect x="875" y="286" width="215" height="130" rx="10"/></g><text x="157" y="361" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24251f">GOLD CONTACT</text><text x="922" y="361" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24251f">GOLD CONTACT</text><path d="M325 351H432M768 351h107" stroke="#d9dce1" stroke-width="5"/><g transform="translate(600 350)"><ellipse rx="148" ry="74" fill="none" stroke="#ef8b62" stroke-width="15" transform="rotate(-38)"/><ellipse rx="136" ry="65" fill="none" stroke="#f5c661" stroke-width="15" transform="rotate(38)"/><path d="M-110 0h220" stroke="#f5c661" stroke-width="10"/><circle r="17" fill="#fff"/></g><path d="M477 232a147 147 0 0 1 231 15" fill="none" stroke="#64c5be" stroke-width="7"/><path d="m699 231 17 17-25 2" fill="#64c5be"/><text x="502" y="211" font-family="Arial,sans-serif" font-size="20" fill="#b7e4dc">rotation</text><path d="M188 495h824" stroke="#555d68" stroke-width="2"/><text x="179" y="545" font-family="Arial,sans-serif" font-size="21" fill="#e9e6de">Voltage direction</text><text x="510" y="545" font-family="Arial,sans-serif" font-size="21" fill="#e9e6de">Helical rotor turns</text><text x="831" y="545" font-family="Arial,sans-serif" font-size="21" fill="#e9e6de">Conductance rises</text><path d="M376 537h100m268 0h71" stroke="#64c5be" stroke-width="4"/><path d="m469 529 12 8-12 8m167-8 12-8v16z" fill="#64c5be"/><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#9ca9b9">Schematic based on the reported mechanism; molecular motion is not shown to scale.</text></svg>
