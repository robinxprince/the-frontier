<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">An archaeon converts long-chain fatty acids into methane</title><desc id="d">Inside one thermophilic archaeon, fatty acid chains are shortened by beta oxidation and feed carbon and electrons into methanogenesis, producing methane and other products.</desc><rect width="1200" height="700" fill="#182420"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#a9bcb0" letter-spacing="3">A DEEP-SUBSURFACE CARBON ROUTE</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#f1efe7">One archaeon can do both jobs</text><ellipse cx="595" cy="372" rx="360" ry="170" fill="#d8e2d8" stroke="#8fb4a2" stroke-width="10"/><ellipse cx="595" cy="372" rx="332" ry="142" fill="none" stroke="#91a397" stroke-width="3" stroke-dasharray="12 10"/><text x="482" y="568" font-family="Arial,sans-serif" font-size="22" fill="#d4ddd3">Methanoglobus AA-75 · thermophilic archaeon</text><g font-family="Arial,sans-serif"><rect x="86" y="291" width="207" height="134" rx="10" fill="#f0c96b"/><text x="116" y="346" font-size="19" font-weight="700" fill="#23241f">C7–C18</text><text x="111" y="376" font-size="18" fill="#23241f">fatty acids</text><path d="M300 360h113" stroke="#315bdb" stroke-width="8"/><path d="m399 344 24 16-24 16" fill="#315bdb"/><rect x="434" y="298" width="245" height="124" rx="8" fill="#315bdb"/><text x="470" y="349" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">β-oxidation</text><text x="462" y="381" font-family="Arial,sans-serif" font-size="16" fill="#e0e7fb">shorter carbon units + electrons</text><path d="M687 360h84" stroke="#315bdb" stroke-width="8"/><path d="m758 344 24 16-24 16" fill="#315bdb"/><rect x="794" y="298" width="226" height="124" rx="8" fill="#24251f"/><text x="825" y="349" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Methanogenesis</text><text x="839" y="381" font-family="Arial,sans-serif" font-size="16" fill="#c8d6ca">Wood–Ljungdahl route</text><path d="M1023 360h77" stroke="#dd835d" stroke-width="8"/><path d="m1087 344 24 16-24 16" fill="#dd835d"/><circle cx="1146" cy="360" r="43" fill="#dd835d"/><text x="1120" y="369" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#23241f">CH₄</text><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#a9bcb0">Pathway schematic from the study; organism and reactions not shown to scale.</text></svg>
