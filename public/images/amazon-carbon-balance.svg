<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Amazon carbon accounting from air samples</title><desc id="desc">A conceptual diagram of aircraft vertical air sampling, which measures carbon dioxide at multiple heights; researchers combine these observations with wind and fire data to estimate regional carbon balance.</desc><rect width="1200" height="700" fill="#eeede9"/><text x="64" y="88" fill="#25241f" font-family="Arial,sans-serif" font-size="34" font-weight="700">Amazon carbon accounting from air samples</text><text x="64" y="145" fill="#68665f" font-family="Arial,sans-serif" font-size="19">MECHANISM MAP · ORIGINAL EXPLANATORY DIAGRAM</text><g><rect x="130" y="250" width="220" height="150" rx="2" fill="#2856d9"/><text x="240" y="310" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="240" dy="0">Air profiles +</tspan><tspan x="240" dy="34">transport</tspan></text></g><path d="M 358 325 H 482" stroke="#2856d9" stroke-width="5"/><path d="M 472 315 L 482 325 L 472 335" fill="none" stroke="#2856d9" stroke-width="5"/><g><rect x="500" y="250" width="220" height="150" rx="2" fill="#dde3db"/><text x="610" y="310" text-anchor="middle" fill="#24231f" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="610" dy="0">regional CO₂ budget</tspan></text></g><text x="64" y="520" fill="#25241f" font-family="Arial,sans-serif" font-size="21">The diagram is conceptual; it does not plot the study data.</text><text x="64" y="650" fill="#68665f" font-family="Arial,sans-serif" font-size="17">THE FRONTIER  /  Conceptual illustration; not research data</text></svg>