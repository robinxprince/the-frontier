<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Cold triggers a metabolite signal from muscle to distant tissues in worms</title><desc id="d">In the worm study, cold increased BH2 production in muscle. BH2 travelled to intestine and neurons, where it was converted to BH4 and supported tyrosine synthesis and protein homeostasis.</desc><rect width="1200" height="700" fill="#eef0e9"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#59675e" letter-spacing="3">A SIGNAL THAT CROSSES TISSUES</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#23241f">Cold changes a metabolic message</text><path d="M135 360c18-102 76-145 181-145s163 43 181 145c-18 102-76 145-181 145S153 462 135 360z" fill="#d9e6dc" stroke="#536c5c" stroke-width="5"/><text x="219" y="367" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#23241f">muscle</text><circle cx="271" cy="307" r="25" fill="#315bdb"/><circle cx="344" cy="408" r="25" fill="#315bdb"/><circle cx="420" cy="315" r="25" fill="#315bdb"/><text x="250" y="562" font-family="Arial,sans-serif" font-size="22" fill="#23241f">CAT-4 makes BH2</text><path d="M500 360h176" stroke="#315bdb" stroke-width="8"/><path d="m661 344 24 16-24 16" fill="#315bdb"/><circle cx="589" cy="310" r="22" fill="#e4be56"/><circle cx="628" cy="397" r="22" fill="#e4be56"/><text x="548" y="474" font-family="Arial,sans-serif" font-size="19" fill="#59675e">transported BH2</text><g><path d="M755 238h144v103H755z" rx="12" fill="#fff" stroke="#98aa9a" stroke-width="4"/><path d="M755 385h144v103H755z" fill="#fff" stroke="#98aa9a" stroke-width="4"/><text x="793" y="301" font-family="Arial,sans-serif" font-size="19" fill="#23241f">intestine</text><text x="804" y="448" font-family="Arial,sans-serif" font-size="19" fill="#23241f">neurons</text><circle cx="847" cy="274" r="13" fill="#315bdb"/><circle cx="847" cy="421" r="13" fill="#315bdb"/></g><path d="M906 360h98" stroke="#315bdb" stroke-width="8"/><path d="m990 344 24 16-24 16" fill="#315bdb"/><rect x="1024" y="285" width="122" height="150" rx="18" fill="#24251f"/><text x="1054" y="344" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">BH4</text><text x="1043" y="382" font-family="Arial,sans-serif" font-size="15" fill="#fff">tyrosine</text><text x="1046" y="405" font-family="Arial,sans-serif" font-size="15" fill="#fff">proteostasis</text><text x="64" y="654" font-family="Arial,sans-serif" font-size="16" fill="#73766c">Reported mainly in C. elegans; human-cell assays are not evidence of human longevity.</text></svg>
