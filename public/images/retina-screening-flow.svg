<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Point-of-care AI retinal screening</title><desc id="desc">A conceptual clinical workflow and screening completion rates in one prospective study of youth with diabetes, not a diagnostic result or clinical recommendation.</desc><rect width="1200" height="700" fill="#e9edf3"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24231f">A SCREENING TEST ONLY HELPS IF PEOPLE GET IT</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#65645e">Point-of-care workflow · study rates, not universal performance guarantees</text><g font-family="Arial,sans-serif"><rect x="80" y="205" width="260" height="170" rx="14" fill="#fff"/><circle cx="170" cy="285" r="42" fill="#d5e7df" stroke="#315bdb" stroke-width="8"/><circle cx="170" cy="285" r="15" fill="#b75b7d"/><text x="230" y="270" font-size="20" font-weight="700" fill="#24231f">RETINAL</text><text x="230" y="300" font-size="20" font-weight="700" fill="#24231f">IMAGE</text><text x="110" y="350" font-size="15" fill="#65645e">non-dilated camera at care visit</text><path d="M355 290h90m-18-17 18 17-18 17" fill="none" stroke="#315bdb" stroke-width="5"/><rect x="465" y="205" width="270" height="170" rx="14" fill="#24231f"/><text x="500" y="255" font-size="21" font-weight="700" fill="#fff">AUTONOMOUS AI</text><path d="M510 300h160" stroke="#8cc5b4" stroke-width="8" stroke-linecap="round"/><circle cx="610" cy="300" r="25" fill="#315bdb"/><text x="500" y="345" font-size="15" fill="#d6d4ce">image quality + disease signal</text><path d="M750 290h90m-18-17 18 17-18 17" fill="none" stroke="#315bdb" stroke-width="5"/><rect x="860" y="205" width="260" height="170" rx="14" fill="#fff"/><text x="895" y="255" font-size="21" font-weight="700" fill="#24231f">NEXT STEP</text><text x="895" y="295" font-size="17" fill="#4d4c47">normal → rescreen</text><text x="895" y="327" font-size="17" fill="#4d4c47">positive → eye specialist</text><rect x="80" y="455" width="1040" height="130" rx="14" fill="#d5e7df"/><text x="120" y="505" font-size="21" font-weight="700" fill="#24231f">SCREENING COMPLETED AFTER IMPLEMENTATION</text><text x="120" y="550" font-size="18" fill="#4d4c47">White cohort</text><text x="270" y="550" font-size="25" font-weight="700" fill="#315bdb">99.5%</text><text x="500" y="550" font-size="18" fill="#4d4c47">Non-White cohort</text><text x="720" y="550" font-size="25" font-weight="700" fill="#315bdb">98.0%</text><text x="900" y="550" font-size="14" fill="#65645e">n = 397 participants</text></g></svg>
